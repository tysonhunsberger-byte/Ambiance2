<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Ambiance Web Desktop</title>
    <link rel="stylesheet" href="/vendor/98.css/dist/98.css" data-theme-style="win98" disabled>
    <link rel="stylesheet" href="/vendor/xp.css/dist/XP.css" data-theme-style="winxp" disabled>
    <link rel="stylesheet" href="/vendor/7.css/dist/7.css" data-theme-style="win7" disabled>
    <style>
        :root {
            --desktop-bg: #0f1c33;
            --wallpaper-url: none;
            --window-glass: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(210,230,255,0.82));
            --window-border: rgba(120,160,210,0.8);
            --text-color: #0d1f3f;
            --button-fill: linear-gradient(180deg, #f9fdff, #dfefff);
            --button-border: rgba(70,120,200,0.85);
            --panel-bg: rgba(255,255,255,0.9);
            --taskbar-height: 44px;
            --toolbar-height: 38px;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--desktop-bg);
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
            padding-top: var(--toolbar-height);
        }
        #wallpaper {
            position: fixed;
            inset: 0;
            background: var(--desktop-bg);
            background-image: var(--wallpaper-url);
            background-size: cover;
            background-position: center;
            filter: saturate(1.05);
            z-index: 0;
        }
        #desktop {
            position: relative;
            width: 100vw;
            height: calc(100vh - var(--taskbar-height) - 38px);
            z-index: 1;
        }
        .window {
            position: absolute;
            width: 460px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            resize: both;
            min-width: 320px;
            min-height: 220px;
            overflow: hidden;
        }
        .window[data-window="studio"] {
            left: 30px;
            top: 30px;
            width: 600px;
            min-height: 360px;
        }
        .window[data-window="plugin-ui"] {
            right: 30px;
            top: 40px;
            width: 460px;
            min-height: 320px;
        }
        .window[data-window="keyboard"] {
            left: 30px;
            top: 360px;
            width: 720px;
            min-height: 260px;
        }
        .window[data-window="console"] {
            right: 30px;
            top: 360px;
            width: 420px;
            min-height: 220px;
        }
        .window[data-window="strudel"] {
            left: 80px;
            top: 80px;
            width: min(1100px, calc(100vw - 160px));
            height: min(640px, calc(100vh - var(--toolbar-height) - var(--taskbar-height) - 120px));
            min-height: 360px;
            max-height: calc(100vh - var(--toolbar-height) - var(--taskbar-height) - 32px);
            resize: both;
            z-index: 9;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .window.maximized {
            left: 12px !important;
            top: calc(var(--toolbar-height) + 8px) !important;
            width: calc(100vw - 24px) !important;
            height: calc(100vh - var(--toolbar-height) - var(--taskbar-height) - 16px) !important;
            max-width: none !important;
            max-height: none !important;
        }
        .window-titlebar {
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            gap: 12px;
        }
        .window-titlebar .title-bar-text {
            font-weight: 600;
            font-size: 14px;
        }
        .window-controls {
            display: flex;
            gap: 4px;
        }
        .window-controls button.is-maximize::before {
            content: "";
            display: block;
            width: 8px;
            height: 8px;
            border: 1px solid currentColor;
            margin: auto;
        }
        body[data-theme="flat"] .window-titlebar {
            background: var(--window-glass);
            border-radius: 12px 12px 0 0;
        }
        body[data-theme="flat"] .window-controls button {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }
        .window-body {
            flex: 1;
            display: flex;
            overflow: auto;
            min-height: 0;
        }
        .window[data-window="strudel"] .window-body {
            overflow: hidden;
            flex-direction: column;
        }
        .window-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            min-height: 0;
        }
        .window[data-window="strudel"] .window-content {
            padding: 10px 14px 16px;
            gap: 10px;
            flex: 1;
        }
        body[data-theme="flat"] .window-content {
            background: var(--panel-bg);
            border-radius: 0 0 12px 12px;
        }
        .strudel-window {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            min-height: 0;
            flex: 1;
            overflow: hidden;
        }
        .strudel-main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: stretch;
        }
        .strudel-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: flex-start;
            border-radius: 10px;
            border: 1px solid rgba(120, 160, 210, 0.5);
            padding: 8px;
            background: rgba(255,255,255,0.95);
            min-height: 48px;
        }
        .strudel-toolbar .strudel-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            margin-left: auto;
        }
        .strudel-toolbar button {
            border: 1px solid rgba(70, 120, 200, 0.7);
            border-radius: 8px;
            background: linear-gradient(180deg, #fefefe, #d7e9ff);
            color: #0d1f3f;
            font-weight: 600;
            padding: 4px 12px;
            cursor: pointer;
            outline: none;
            transition: filter 0.08s ease, box-shadow 0.08s ease;
            box-shadow: inset 0 0 0 rgba(0,0,0,0);
        }
        .strudel-toolbar button:active {
            filter: brightness(0.94);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.35);
        }
        .strudel-toolbar .nav-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .sequencer-panel {
            margin-top: 0;
            border: 1px solid rgba(51, 74, 117, 0.35);
            border-radius: 14px;
            padding: 14px 16px 16px;
            background: rgba(248, 250, 255, 0.98);
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 1;
            flex: 0 0 auto;
            width: 100%;
            min-height: 0;
            box-shadow: 0 10px 28px rgba(8, 20, 46, 0.18);
            font-size: 13px;
            color: #0d1f3f;
        }
        .sequencer-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-start;
        }
        .sequencer-controls label {
            font-weight: 600;
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(255,255,255,0.95);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(120, 160, 210, 0.4);
            flex: 1 1 45%;
            min-width: 150px;
            color: #0d1f3f;
        }
        .sequencer-controls input[type="number"] {
            width: 80px;
            padding: 6px 8px;
            font-size: 14px;
        }
        .sequencer-panel button {
            font-size: 14px;
            padding: 6px 14px;
            color: #0d1f3f;
        }
        .sequencer-rows {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: auto;
            padding-right: 4px;
            flex: 1;
            min-height: 0;
            border-radius: 10px;
            padding-top: 2px;
        }
        .sequencer-row {
            border: 1px solid rgba(120, 160, 210, 0.4);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255,255,255,0.95);
        }
        .sequencer-row-header {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .sequencer-row-header input,
        .sequencer-panel input,
        .sequencer-panel select {
            padding: 5px 8px;
            font-size: 14px;
            color: #0d1f3f;
            background: #ffffff;
            border: 1px solid rgba(120, 160, 210, 0.6);
            border-radius: 6px;
        }
        .sequencer-row-header .row-actions {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }
        .sequencer-row-extra {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .sequencer-row-extra label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
        }
        .sequencer-row.mode-melody .row-field-bank,
        .sequencer-row.mode-melody .row-field-voice-sample {
            display: none;
        }
        .sequencer-row:not(.mode-melody) .sequencer-row-extra {
            display: none;
        }
        .sequencer-row:not(.mode-melody) .row-field-voice-melody {
            display: none;
        }
        .sequencer-beats {
            display: grid;
            grid-template-columns: repeat(var(--sequencer-steps, 16), minmax(20px, 1fr));
            gap: 4px;
        }
        .sequencer-beat {
            border: 1px solid rgba(120, 120, 120, 0.4);
            background: #f4f7ff;
            border-radius: 6px;
            padding: 8px 0;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            transition: background 120ms ease, color 120ms ease, border 120ms ease;
        }
        .sequencer-beat.active {
            background: #4c7dff;
            color: #fff;
            border-color: #1f49d3;
            box-shadow: 0 0 6px rgba(76, 125, 255, 0.5);
        }
        .sequencer-preview textarea {
            width: 100%;
            min-height: 80px;
            border-radius: 8px;
            padding: 8px;
            border: 1px solid rgba(120, 160, 210, 0.5);
            font-family: "SF Mono", "Consolas", monospace;
            resize: vertical;
            flex: 1;
            color: #0d1f3f;
            background: #ffffff;
        }
        .sequencer-preview {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        @media (max-width: 1280px) {
            .sequencer-panel {
                overflow: auto;
            }
        }
        @media (max-width: 900px) {
            .sequencer-controls {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        .strudel-shell {
            position: relative;
            flex: 1 1 auto;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(120, 160, 210, 0.5);
            box-shadow: inset 0 0 12px rgba(0,0,0,0.15);
            min-height: 360px;
            min-width: 0;
            display: flex;
            height: 100%;
            background: #05070d;
        }
        .strudel-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(4, 15, 36, 0.92);
            color: #dfe9ff;
            z-index: 2;
            transition: opacity 0.3s ease;
        }
        .strudel-placeholder.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #strudelWebviewContainer {
            flex: 1 1 auto;
            display: flex;
            width: 100%;
            min-height: 360px;
            border-radius: 12px;
            background: #0b0b0b;
            overflow: hidden;
            position: relative;
            z-index: 0;
        }
        #strudelFrame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #0b0b0b;
            position: relative;
            z-index: 0;
        }
        .panel {
            border-radius: 12px;
            border: 1px solid rgba(120, 160, 210, 0.5);
            padding: 12px;
            background: rgba(255, 255, 255, 0.92);
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }
        .panel button {
            border: 1px solid rgba(70, 120, 200, 0.7);
            border-radius: 8px;
            background: linear-gradient(180deg, #fefefe, #d7e9ff);
            color: #0d1f3f;
            font-weight: 600;
            padding: 4px 12px;
            cursor: pointer;
            outline: none;
            transition: filter 0.08s ease, box-shadow 0.08s ease;
            box-shadow: inset 0 0 0 rgba(0,0,0,0);
        }
        .panel button:active {
            filter: brightness(0.94);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.35);
        }
        .list {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card {
            border-radius: 10px;
            border: 1px solid rgba(90, 130, 200, 0.4);
            padding: 10px 12px;
            background: rgba(246, 252, 255, 0.95);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }
        .card h3 {
            margin: 0;
            font-size: 15px;
        }
        .card span {
            font-size: 12px;
            color: #3a598d;
        }
        .card button {
            border-radius: 20px;
            padding: 6px 16px;
            border: 1px solid var(--button-border);
            background: var(--button-fill);
            cursor: pointer;
            font-weight: 600;
            color: #0f264d;
        }
        .card button.secondary {
            border-color: rgba(200, 80, 80, 0.8);
            background: linear-gradient(180deg, #ffe3e3, #ffbcbc);
            color: #6e1414;
        }
        .chain-chip {
            border-radius: 12px;
            padding: 6px 12px;
            border: 1px solid rgba(120, 160, 210, 0.4);
            background: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            cursor: pointer;
        }
        .chain-chip.active {
            border-color: rgba(60, 120, 210, 0.9);
            background: rgba(120, 170, 255, 0.3);
            font-weight: 600;
        }
        #taskbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--taskbar-height);
            background: linear-gradient(180deg, rgba(120, 170, 255, 0.95), rgba(60, 120, 210, 0.92));
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.5), inset 0 -1px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            padding: 4px 18px;
            gap: 12px;
            z-index: 2;
        }
        #taskbar .start {
            width: 120px;
            height: calc(var(--taskbar-height) - 8px);
            border-radius: 18px;
            border: 1px solid rgba(30, 90, 60, 0.9);
            background: linear-gradient(180deg, #b9ffca, #5bbd7a);
            color: #ffffff;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: normal;
            text-shadow: 0 1px rgba(0, 0, 0, 0.4);
        }
        #taskbar .start:active {
            filter: brightness(0.92);
            transform: translateY(1px);
        }
        body[data-theme="winxp"] #taskbar .start {
            width: 110px;
            border-radius: 22px;
            border: 1px solid rgba(60, 110, 170, 0.9);
            background: url('/start/winxp_start.png') no-repeat center center / contain;
            color: transparent;
            text-indent: -9999px;
            overflow: hidden;
            box-shadow: none;
        }
        body[data-theme="winxp"] #taskbar .start:active {
            filter: brightness(0.95);
        }
        body[data-theme="win7"] #taskbar .start {
            width: 130px;
            border-radius: 26px;
            border: 1px solid rgba(30, 80, 120, 0.8);
            background: url('/start/win7_start.png') no-repeat center center / contain;
            color: transparent;
            text-indent: -9999px;
            overflow: hidden;
            box-shadow: none;
        }
        body[data-theme="win7"] #taskbar .start:active {
            filter: brightness(0.92);
        }
        body[data-theme="win98"] #taskbar .start {
            width: 96px;
            height: calc(var(--taskbar-height) - 10px);
            border-radius: 4px;
            border: 2px solid #ffffff;
            background: #c0c0c0 url('/start/win98_start.png') no-repeat center center / contain;
            color: transparent;
            text-indent: -9999px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px #808080;
        }
        body[data-theme="win98"] #taskbar .start:active {
            filter: brightness(0.9);
            box-shadow: inset 0 0 0 1px #404040;
        }
        #taskbar .clock {
            margin-left: auto;
            color: #0f244a;
            font-weight: 600;
        }
        #windowButtons {
            display: flex;
            gap: 8px;
            flex: 1;
            align-items: center;
        }
        .taskbar-button {
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.4);
            color: #0d2040;
            cursor: pointer;
            font-weight: 600;
            transition: filter 120ms ease;
        }
        .taskbar-button:hover {
            filter: brightness(1.1);
        }
        .taskbar-button.active {
            background: rgba(80, 150, 255, 0.9);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.8);
        }
        body[data-theme="flat"] {
            --desktop-bg: #222222;
            --window-glass: linear-gradient(180deg, #3a3a3a, #2b2b2b);
            --window-border: rgba(120, 120, 120, 0.9);
            --panel-bg: rgba(40, 40, 40, 0.95);
            --text-color: #f0f0f0;
            --button-fill: linear-gradient(180deg, #3f3f3f, #2a2a2a);
            --button-border: rgba(140, 140, 140, 0.9);
        }
        body[data-theme="flat"] .window {
            color: #f0f0f0;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
        }
        body[data-theme="flat"] .card,
        body[data-theme="flat"] .panel {
            color: #f0f0f0;
            border-color: rgba(96, 96, 96, 0.9);
        }
        body[data-theme="flat"] .panel,
        body[data-theme="flat"] .card {
            background: #2a2a2a;
            border-color: #444;
            color: #f5f5f5;
        }
        body[data-theme="flat"] .card span,
        body[data-theme="flat"] .card h3,
        body[data-theme="flat"] .panel h3,
        body[data-theme="flat"] .panel p {
            color: #f5f5f5;
        }
        body[data-theme="flat"] .panel h3 {
            color: #ffffff;
        }
        body[data-theme="flat"] .card button,
        body[data-theme="flat"] .panel button {
            background: linear-gradient(180deg, #f5f5f5, #d6d6d6);
            color: #101010;
            border: 1px solid #6a6a6a;
        }
        body[data-theme="flat"] #taskbar {
            background: linear-gradient(180deg, #1f1f1f, #121212);
            border-top: 1px solid #333;
        }
        body[data-theme="flat"] #taskbar .start {
            background: #3a3a3a;
            border: 1px solid #5a5a5a;
            border-radius: 6px;
            color: #ffffff;
        }
        body[data-theme="flat"] #taskbar .clock {
            color: #f0f0f0;
        }
        body[data-theme="flat"] .taskbar-button {
            border: 1px solid #3d3d3d;
            background: linear-gradient(180deg, #2d2d2d, #161616);
            color: #f0f0f0;
        }
        body[data-theme="flat"] .taskbar-button.active {
            background: #4a4a4a;
            color: #ffffff;
        }
        body[data-theme="flat"] .window {
            background: var(--panel-bg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            border: 1px solid var(--window-border);
        }
        body[data-theme="win7"] {
            --desktop-bg: #3c6db5;
            --window-glass: linear-gradient(180deg, #fefefe, #d3e5ff);
            --window-border: rgba(84, 126, 199, 0.9);
            --panel-bg: rgba(249, 251, 254, 0.96);
            --text-color: #0d1f3c;
            --button-fill: linear-gradient(180deg, #eef6ff, #cbe2ff);
            --button-border: rgba(80, 120, 200, 0.7);
            --taskbar-height: 50px;
        }
        body[data-theme="win7"] #web-toolbar {
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(210,230,255,0.92));
            border-bottom: 1px solid rgba(255,255,255,0.7);
            color: #0d1f3c;
        }
        body[data-theme="win7"] #taskbar {
            background: linear-gradient(180deg, #e5f0ff 0%, #9fc9ff 40%, #4d89d6 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.9), inset 0 -1px rgba(0, 0, 0, 0.25);
            padding: 4px 16px;
        }
        body[data-theme="win7"] #taskbar .start {
            width: 118px;
            height: var(--taskbar-height);
            margin: 0;
            background: transparent;
            border: none;
            background-image: url("/start/win7_start.png");
            background-repeat: no-repeat;
            background-size: contain;
            background-position: left center;
            text-indent: -9999px;
            color: transparent;
        }
        body[data-theme="win7"] #taskbar .start:active {
            filter: brightness(0.96);
        }
        body[data-theme="win7"] #windowButtons {
            gap: 6px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            padding: 3px 6px;
        }
        body[data-theme="win7"] .taskbar-button {
            border-radius: 14px;
            padding: 6px 18px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(80,140,210,0.35));
            color: #f4fbff;
            text-shadow: 0 1px rgba(0,0,0,0.5);
            box-shadow: inset 0 1px rgba(255,255,255,0.8), inset 0 -1px rgba(0,0,0,0.3);
        }
        body[data-theme="win7"] .taskbar-button:hover {
            background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(120,170,230,0.55));
        }
        body[data-theme="win7"] .taskbar-button.active {
            border-color: rgba(255,255,255,0.85);

    <script>
        const DesktopState = {
            theme: "flat",
            wallpaper: { image: null, color: "#222222", offset: 0.5 },
            themes: [],
            windows: [],
        };
        const PluginState = {
            plugins: [],
            chain: [],
            hostStatus: "",
            currentPluginPath: null,
            workspace: "",
        };
        const KeyboardState = {
            velocity: 80,
            octave: 3,
            activeNotes: [],
            enabled: false,
        };
        const StrudelState = {
            loaded: false,
            visible: false,
            url: null, // proxied iframe URL
            displayUrl: null, // remote URL shown in UI
            error: null,
            remoteHome: "https://strudel.cc/",
            homeUrl: "https://strudel.cc/",
            proxyBase: null,
            reloadToken: 0,
            lastReloadToken: -1,
            debugSync: false,
        };
        const DrumCatalog = {
            banks: new Map(),
            bankOrder: [],
            defaultBank: "tr909",
            defaultInstrument: "bd",
            loaded: false,
            promise: null,
        };
        const FALLBACK_BANK_ENTRY = {
            id: "tr909",
            bank: "tr909",
            label: "TR-909",
            instruments: new Map([
                ["bd", 4],
                ["sd", 4],
                ["hh", 4],
                ["oh", 4],
                ["cp", 2],
            ]),
        };
        const FALLBACK_INSTRUMENT_OPTIONS = [
            { value: "bd", label: "bd" },
            { value: "sd", label: "sd" },
            { value: "hh", label: "hh" },
            { value: "oh", label: "oh" },
            { value: "cp", label: "cp" },
        ];
        function cloneBankEntry(entry) {
            return {
                id: entry.id,
                bank: entry.bank,
                label: entry.label,
                instruments: new Map(entry.instruments),
            };
        }
        function resetDrumCatalogToFallback() {
            const fallbackClone = cloneBankEntry(FALLBACK_BANK_ENTRY);
            DrumCatalog.banks = new Map([[fallbackClone.id, fallbackClone]]);
            DrumCatalog.bankOrder = [fallbackClone];
            DrumCatalog.defaultBank = fallbackClone.id;
            DrumCatalog.defaultInstrument = "bd";
            DrumCatalog.loaded = false;
        }
        resetDrumCatalogToFallback();
        function buildInstrumentOptionList(entry) {
            if (!entry) {
                return [...FALLBACK_INSTRUMENT_OPTIONS];
            }
            const options = [];
            entry.instruments.forEach((count, instrumentId) => {
                const total = Math.max(1, Number(count) || 1);
                if (total <= 1) {
                    options.push({ value: instrumentId, label: instrumentId });
                } else {
                    for (let idx = 0; idx < total; idx += 1) {
                        const token = `${instrumentId}:${idx}`;
                        options.push({ value: token, label: token });
                    }
                }
            });
            if (!options.length) {
                return [...FALLBACK_INSTRUMENT_OPTIONS];
            }
            options.sort((a, b) => a.label.localeCompare(b.label));
            return options;
        }
        function getDrumBankEntries() {
            return DrumCatalog.bankOrder.length ? DrumCatalog.bankOrder : [FALLBACK_BANK_ENTRY];
        }
        function getBankEntry(bankId) {
            return DrumCatalog.banks.get(bankId) || DrumCatalog.bankOrder[0] || FALLBACK_BANK_ENTRY;
        }
        function getInstrumentOptions(bankId) {
            const entry = getBankEntry(bankId);
            return buildInstrumentOptionList(entry);
        }
        function getDefaultBankId() {
            return DrumCatalog.defaultBank || (DrumCatalog.bankOrder[0]?.id) || FALLBACK_BANK_ENTRY.id;
        }
        function getDefaultInstrumentValue(bankId) {
            const options = getInstrumentOptions(bankId);
            return options[0]?.value || DrumCatalog.defaultInstrument || "bd";
        }
        function ensureRowBank(row) {
            if (row.mode === "melody") {
                row.bank = row.bank || "";
                return;
            }
            if (!row.bank || !DrumCatalog.banks.has(row.bank)) {
                row.bank = getDefaultBankId();
            }
        }
        function ensureRowInstrument(row) {
            ensureRowBank(row);
            if (row.mode === "melody") {
                row.instrument = row.instrument || "sin";
                return;
            }
            const options = getInstrumentOptions(row.bank);
            if (!options.some((option) => option.value === row.instrument)) {
                row.instrument = options[0]?.value || DrumCatalog.defaultInstrument;
            }
        }
        function populateBankSelect(select, row) {
            if (!select) return;
            const banks = getDrumBankEntries();
            select.innerHTML = "";
            banks.forEach((entry) => {
                const opt = document.createElement("option");
                opt.value = entry.id;
                opt.textContent = entry.label || entry.id;
                select.appendChild(opt);
            });
            ensureRowBank(row);
            select.value = row.bank;
        }
        function populateInstrumentSelect(select, row) {
            if (!select) return;
            ensureRowInstrument(row);
            const options = getInstrumentOptions(row.bank);
            select.innerHTML = "";
            options.forEach((option) => {
                const opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                select.appendChild(opt);
            });
            select.value = row.instrument;
        }
        function hydrateSequencerRowSelectors(rowEl, row) {
            const bankSelect = rowEl.querySelector('select[data-field="bank"]');
            const instrumentSelect = rowEl.querySelector('select[data-field="instrumentSelect"]');
            populateBankSelect(bankSelect, row);
            if (instrumentSelect) {
                populateInstrumentSelect(instrumentSelect, row);
            }
            const instrumentInput = rowEl.querySelector('input[data-field="instrumentInput"]');
            if (instrumentInput) {
                instrumentInput.value = row.instrument || "";
            }
        }

                defaultStepsInput.value = SequencerState.defaultSteps;
            }
            if (rowsHost) {
                rowsHost.innerHTML = "";
                const fragment = document.createDocumentFragment();
                SequencerState.rows.forEach((row) => {
                    ensureRowBeatLength(row);
                    const rowEl = document.createElement("div");
                    rowEl.className = "sequencer-row";
                    rowEl.dataset.rowId = row.id;
                    const structValue = clampNumber(Number(row.structDivisor) || row.steps, 1, 256);
                    rowEl.innerHTML = `
                        <div class="sequencer-row-header">
                            <label>Type
                                <select data-field="mode">
                                    <option value="sample"${row.mode === "melody" ? "" : " selected"}>Sample</option>
                                    <option value="melody"${row.mode === "melody" ? " selected" : ""}>Melody</option>
                                </select>
                            </label>
                            <label class="row-field-voice row-field-voice-sample">
                                Instrument
                                <select data-field="instrumentSelect"></select>
                            </label>
                            <label class="row-field-voice row-field-voice-melody">
                                Synth
                                <input type="text" value="${escapeHtml(row.instrument || "")}" data-field="instrumentInput" placeholder="sin">
                            </label>
                            <label class="row-field-bank">
                                Bank
                                <select data-field="bank"></select>
                            </label>
                            <label>Steps
                                <input type="number" min="1" max="64" value="${row.steps}" data-field="steps">
                            </label>
                            <label>Struct %
                                <input type="number" min="1" max="256" value="${structValue}" data-field="structDivisor">
                            </label>
                            <div class="row-actions">
                                <button type="button" data-action="remove-row">Remove</button>
                            </div>
                        </div>
                        <div class="sequencer-row-extra">
                            <label>Pitch Mode
                                <select data-field="pitchMode">
                                    <option value="scale"${row.pitchMode === "note" ? "" : " selected"}>Scale Degree</option>
                                    <option value="note"${row.pitchMode === "note" ? " selected" : ""}>Explicit Note</option>
                                </select>
                            </label>
                            <label>Pitch Pattern
                                <input type="text" value="${escapeHtml(row.pitchSequence || "")}" data-field="pitchSequence" placeholder="${row.pitchMode === "note" ? "c4 e4 g4" : "0 2 4 5"}">
                            </label>
                            <label class="row-field-scale">
                                Scale List
                                <input type="text" value="${escapeHtml(row.scaleList || "")}" data-field="scaleList" placeholder="A:minor,B:major">
                            </label>
                        </div>
                        <div class="sequencer-beats" style="--sequencer-steps:${row.steps};">
                            ${row.beats.map((active, index) => `<button type="button" class="sequencer-beat${active ? " active" : ""}" data-beat="${index}">${index + 1}</button>`).join("")}
                        </div>
                    `;
                    fragment.appendChild(rowEl);
                    hydrateSequencerRowSelectors(rowEl, row);
                    applySequencerRowModeClasses(rowEl, row);
                });
                rowsHost.appendChild(fragment);
            }
            if (updatePreview) {
                const preview = document.getElementById("sequencerCodePreview");
                if (preview) {
                    preview.value = buildSequencerCode();
                }
            }
            updateStrudelFrameBounds();
        }
        function ensureStrudelVisible() {
            if (StrudelState.visible) return;
            if (Bridges.strudel) {
                Bridges.strudel.open();
            }
        }
        function applySequencerToStrudel(play = false) {
            ensureStrudelVisible();
            const code = buildSequencerCode();
            sendStrudelCode(code);
            const preview = document.getElementById("sequencerCodePreview");
            if (preview) preview.value = code;
            if (play) {
                setTimeout(() => sendStrudelAction("update"), 200);
            }
        }
        function initSequencer() {
            const rowsHost = document.getElementById("sequencerRows");
            if (!rowsHost) {
                return;
            }
            if (!SequencerState.rows.length) {
                addSequencerRow();
            } else {
                renderSequencer();
            }
            if (!rowsHost.dataset.handlersAttached) {
                rowsHost.dataset.handlersAttached = "true";
                rowsHost.addEventListener("click", (event) => {
                    const beatButton = event.target.closest(".sequencer-beat");
                    const rowEl = event.target.closest(".sequencer-row");
                    if (!rowEl) return;
                    const rowId = rowEl.dataset.rowId;
                    if (event.target.matches("[data-action='remove-row']")) {
                        removeSequencerRow(rowId);
                        return;
                    }
                    if (beatButton) {
                        const step = Number(beatButton.dataset.beat);
                        toggleSequencerBeat(rowId, step);
                        return;
                    }
                });
                rowsHost.addEventListener("input", (event) => {
                    const target = event.target;
                    const rowEl = target.closest(".sequencer-row");
                    if (!rowEl) return;
                    const rowId = rowEl.dataset.rowId;
                    if (target.dataset.field === "steps") {
                        updateSequencerField(rowId, target.dataset.field, target.value);
                    }
                });
                rowsHost.addEventListener("change", (event) => {
                    const target = event.target;
                    const rowEl = target.closest(".sequencer-row");
                    if (!rowEl) return;
                    const rowId = rowEl.dataset.rowId;
                    if (target.dataset.field === "bank") {
                        updateSequencerField(rowId, "bank", target.value);
                        const row = getSequencerRow(rowId);
                        if (row) {
                            const instrumentSelect = rowEl.querySelector('select[data-field="instrument"]');
                            populateInstrumentSelect(instrumentSelect, row);
                        }
                        return;
                    }
                    if (target.dataset.field === "instrument") {
                        updateSequencerField(rowId, "instrument", target.value);
                    }
                });
            }
            renderSequencer();
        }
        window.initSequencer = initSequencer;
    </script>
</body>
</html>
